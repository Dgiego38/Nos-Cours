<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours de la Classe - Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- En-tête -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">📚 Cours de la Classe</h1>
                <p class="text-sm text-slate-500">Fiches, PDF et prises de notes partagées</p>
            </div>
            <!-- Barre de recherche -->
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Rechercher un chapitre..." 
                    class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg text-sm focus:bg-white focus:border-blue-500 focus:outline-none transition">
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Filtres par matière -->
        <div class="flex flex-wrap gap-2 mb-6" id="filterButtons">
            <button onclick="filterCourses('all')" class="filter-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white transition">Tout</button>
            <button onclick="filterCourses('Maths')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">Maths</button>
            <button onclick="filterCourses('Physique-Chimie')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">Physique-Chimie</button>
            <button onclick="filterCourses('Histoire-Géo')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">Histoire-Géo</button>
            <button onclick="filterCourses('Français')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">Français</button>
            <button onclick="filterCourses('SVT')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">SVT</button>
        </div>

        <!-- Grille des cours (remplie automatiquement par le script ci-dessous) -->
        <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- Message si aucun résultat -->
        <div id="noResults" class="hidden text-center py-12">
            <p class="text-slate-500 text-lg">Aucun cours trouvé pour cette recherche 😕</p>
        </div>
    </main>

    <script>
        // ==========================================
        // 👇 AJOUTE TES NOUVEAUX COURS ICI 👇
        // ==========================================
        const courses = [
            {
                title: "Chapitre 1 : Les fonctions affines et du second degré",
                subject: "Maths",
                date: "14 Nov. 2026",
                type: "PDF",
                link: "cours/maths-chap1.pdf" // Mets ici le chemin vers ton fichier PDF dans ton dépôt GitHub ou un lien Google Drive
            },
            {
                title: "La Révolution française et l'Empire",
                subject: "Histoire-Géo",
                date: "10 Nov. 2026",
                type: "Fiche",
                link: "cours/histoire-revolution.pdf"
            },
            {
                title: "La mole et la concentration molaire",
                subject: "Physique-Chimie",
                date: "05 Nov. 2026",
                type: "PDF",
                link: "cours/pc-la-mole.pdf"
            },
            {
                title: "Méthode du commentaire composé",
                subject: "Français",
                date: "02 Nov. 2026",
                type: "Méthode",
                link: "cours/francais-methode.pdf"
            }
        ];

        // Couleurs associées aux matières
        const subjectColors = {
            "Maths": "bg-blue-100 text-blue-700",
            "Physique-Chimie": "bg-purple-100 text-purple-700",
            "Histoire-Géo": "bg-amber-100 text-amber-700",
            "Français": "bg-rose-100 text-rose-700",
            "SVT": "bg-emerald-100 text-emerald-700"
        };

        let currentSubject = 'all';

        function renderCourses() {
            const grid = document.getElementById('coursesGrid');
            const noResults = document.getElementById('noResults');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            grid.innerHTML = '';

            const filtered = courses.filter(course => {
                const matchesSubject = currentSubject === 'all' || course.subject === currentSubject;
                const matchesSearch = course.title.toLowerCase().includes(searchTerm) || course.subject.toLowerCase().includes(searchTerm);
                return matchesSubject && matchesSearch;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filtered.forEach(course => {
                    const badgeColor = subjectColors[course.subject] || "bg-slate-100 text-slate-700";
                    const card = `
                        <a href="${course.link}" target="_blank" class="group block bg-white p-5 rounded-xl border border-slate-200 hover:border-blue-400 hover:shadow-md transition">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${badgeColor}">
                                    ${course.subject}
                                </span>
                                <span class="text-xs text-slate-400">${course.date}</span>
                            </div>
                            <h2 class="font-semibold text-slate-800 group-hover:text-blue-600 transition mb-4 line-clamp-2">
                                ${course.title}
                            </h2>
                            <div class="flex items-center justify-between text-xs font-medium text-slate-500 pt-3 border-t border-slate-100">
                                <span><i class="fa-regular fa-file-pdf mr-1.5 text-red-500"></i>${course.type}</span>
                                <span class="text-blue-600 group-hover:translate-x-1 transition-transform">Ouvrir →</span>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
            }
        }

        function filterCourses(subject) {
            currentSubject = subject;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.textContent === subject || (subject === 'all' && btn.textContent === 'Tout')) {
                    btn.className = "filter-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white transition";
                } else {
                    btn.className = "filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition";
                }
            });
            renderCourses();
        }

        document.getElementById('searchInput').addEventListener('input', renderCourses);

        // Affichage initial
        renderCourses();
    </script>
</body>
</html>
